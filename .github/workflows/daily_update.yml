name: Daily Pitcher Stress Update

on:
  schedule:
    - cron: "0 11 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update 2026 Statcast data
        run: python update_2026.py

      - name: Commit updated data
        run: |
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add data/count_stress_2026.parquet
            git add data/leaderboards/leaderboard_2026.csv
            git commit -m "Daily 2026 pitcher stress update" || echo "No changes to commit"
            git push